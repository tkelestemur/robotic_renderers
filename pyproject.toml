[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "robotic-renderers"
version = "0.1.0"
description = "Research comparison of rendering pipelines on one Franka FR3 scene"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imageio>=2.38.1,<3",
  "imageio-ffmpeg>=0.8.1,<0.9",
  "mujoco==4.0.1",
  "mujoco-warp==4.0.1",
  "numpy>=2.5.4,<3",
  "pillow>=13,<14",
  "pygame-ce>=2.5.8,<3",
  "usd-core==26.11",
  "warp-lang==1.19.0",
]

[project.scripts]
robotic-renderers = "robotic_renderers.cli:main"
robotic-renderers-throughput = "robotic_renderers.benchmarks.throughput:main"

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17.5,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/robotic_renderers"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA/RTX device",
  "integration: requires an external renderer or graphics context",
  "remote: requires SSH or a remote service",
]

[tool.ruff]
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "outputs",
  "third_party",
]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
