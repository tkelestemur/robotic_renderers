[project]
name = "robotic-renderers-ovrtx-runtime"
version = "0.1.0"
description = "Pinned Linux/RTX runtime for the robotic-renderers ovrtx backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "ovrtx==0.7.0.1794596436",
  "ovstage==0.4.0.1794520352",
  "warp-lang==1.19.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
